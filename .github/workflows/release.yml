name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      browser_coverage: all

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Check that the tag matches package.json
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Download the verified tarball
        uses: actions/download-artifact@v4
        with:
          name: theme-studio-release-tarball
          path: dist
      - name: Check the verified tarball
        shell: bash
        run: |
          tarball="$(ls dist/*.tgz)"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"
          tar -xzf "$tarball" -C dist package/package.json package/lib/client.js
          packed="v$(node -p 'require("./dist/package/package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$packed" ]; then
            echo "::error::Verified tarball version $packed does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
          tar -tzf "$tarball" | tee packed-files.txt
          for required in \
            package/package.json \
            package/cordis.patch.yml \
            package/lib/index.js \
            package/lib/client.js \
            package/lib/types/index.d.ts \
            package/lib/types/client/index.d.ts \
            package/README.md \
            package/README.en.md \
            package/CHANGELOG.md \
            package/CHANGELOG.en.md
          do
            grep -qx "$required" packed-files.txt || {
              echo "::error::The verified tarball is missing $required"
              exit 1
            }
          done
          if ! grep -Fq 'window.__ModuleLoader__.load' dist/package/lib/client.js; then
            echo "::error::The verified client bundle has no ModuleLoader registration"
            exit 1
          fi
      # Requires an npm trusted publisher bound to this repository/release.yml.
      - name: Publish to npm with OIDC
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          case "$version" in
            *-alpha.*) tag=alpha ;;
            *-beta.*) tag=beta ;;
            *-rc.*) tag=next ;;
            *-*)
              echo "::error::Unrecognized prerelease tag in $version"
              exit 1
              ;;
            *) tag=latest ;;
          esac
          echo "Publishing $version with dist-tag $tag"
          npm install --global npm@^11.5.1
          npm publish "$TARBALL" --access public --provenance --tag "$tag"
      - name: Generate release notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md "$TARBALL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
